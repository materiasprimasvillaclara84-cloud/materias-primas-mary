<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Satisfacción - ERMP Villa Clara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-industrial { background-color: #0056b3; }
        .text-industrial { color: #0056b3; }
        .border-industrial { border-color: #0056b3; }
        .bg-vibrant-red { background-color: #d9534f; }
        .accent-red { accent-color: #d9534f; }
        
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-group i {
            position: absolute;
            left: 12px;
            color: #6b7280;
        }
        .input-group input, .input-group textarea {
            padding-left: 35px !important;
        }
        /* Estilo para resaltar campos inválidos mientras se escribe */
        input:invalid:focus {
            border-color: #d9534f;
            ring: 2px;
            ring-color: #d9534f;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <header class="bg-white shadow-md border-b-4 border-industrial">
        <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="w-16 h-16 rounded-full border-4 border-t-blue-600 border-r-red-500 border-b-blue-600 border-l-red-500 flex items-center justify-center font-bold text-xs text-center p-1">
                    ERMP VC
                </div>
                <div>
                    <h1 class="text-xl font-bold text-industrial leading-tight">Empresa de Recuperación de Materias Primas Villa Clara</h1>
                    <p class="text-sm italic text-gray-600">"Materia Prima | Comprometidos con el Medio Ambiente"</p>
                </div>
            </div>
            <div class="mt-4 md:mt-0 text-center md:text-right">
                <span class="bg-vibrant-red text-white px-3 py-1 rounded-full text-sm font-bold uppercase tracking-widest">¡Recuperando VALORES!</span>
            </div>
        </div>
    </header>

        <form action="https://formspree.io/f/xwvygeop" method="POST">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    
                    <div class="input-group">
                        <i class="fas fa-building"></i>
                        <input type="text" name="empresa" placeholder="Nombre de la Empresa" 
                               required 
                               pattern="^[A-Za-zñÑáéíóúÁÉÍÓÚ\s]+$" 
                               title="Por favor, ingrese solo letras."
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-industrial outline-none">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text" name="direccion" placeholder="Dirección" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-industrial outline-none">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" name="telefono" placeholder="Teléfono" 
                               pattern="[0-9]+" 
                               title="Por favor, ingrese solo números."
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-industrial outline-none">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" placeholder="E-Mail" 
                               required 
                               title="Debe incluir un '@' y un dominio válido."
